services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
    ports:
      - "5432:5432"
    volumes:
      - pulso_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulso} -d ${POSTGRES_DB:-pulso}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulso_dev_pgdata:

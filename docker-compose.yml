services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
    volumes:
      - pulso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulso} -d ${POSTGRES_DB:-pulso}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Coolify/Traefik entra por la red interna. No publicamos el 3000 en el host:
    # ese puerto suele estar ocupado por el propio panel u otra app.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      APP_ORIGIN: ${APP_ORIGIN_PUBLIC:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE_PUBLIC:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: ${TZ:-Europe/Madrid}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pulso_pgdata:
